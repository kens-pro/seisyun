name: Update autumn dates
on: [push]
jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Update September and October schedule
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
            'ヤマハ青春ポップス | 大津わにセンター 8月体験・見学受付中': 'ヤマハ青春ポップス | 大津わにセンター 9月・10月体験・見学受付中',
            '大津市和邇のヤマハ青春ポップス。昭和歌謡を歌って、軽く動いて、仲間と笑う大人の歌の教室。8月5日・19日（水）13:00 体験・見学受付中。': '大津市和邇のヤマハ青春ポップス。昭和歌謡を歌って、軽く動いて、仲間と笑う大人の歌の教室。9月2日・16日、10月7日・21日（水）13:00 体験・見学受付中。',
            '大津わにセンター<br>8月体験・見学受付中': '大津わにセンター<br>9月・10月体験・見学受付中',
            '8/5（水）・8/19（水）13:00': '9/2・9/16・10/7・10/21（水）13:00',
            '8月5日・19日（水）13:00、体験・見学受付中。初めての方も安心してご参加いただけます。': '9月2日・16日、10月7日・21日（水）13:00、体験・見学受付中。初めての方も安心してご参加いただけます。',
            '8月の体験・見学を予約': '9月・10月の体験・見学を予約',
            '8月体験・見学受付中': '9月・10月体験・見学受付中',
            '<div class="trial-date">8/5（水）<span>13:00 体験・見学</span></div>\n          <div class="trial-date">8/19（水）<span>13:00 体験・見学</span></div>': '<div class="trial-date">9/2（水）<span>13:00 体験・見学</span></div>\n          <div class="trial-date">9/16（水）<span>13:00 体験・見学</span></div>\n          <div class="trial-date">10/7（水）<span>13:00 体験・見学</span></div>\n          <div class="trial-date">10/21（水）<span>13:00 体験・見学</span></div>',
            '<option value="8月5日（水）13:00">8月5日（水）13:00</option>\n                  <option value="8月19日（水）13:00">8月19日（水）13:00</option>\n                  <option value="どちらでもよい・相談したい">どちらでもよい・相談したい</option>': '<option value="9月2日（水）13:00">9月2日（水）13:00</option>\n                  <option value="9月16日（水）13:00">9月16日（水）13:00</option>\n                  <option value="10月7日（水）13:00">10月7日（水）13:00</option>\n                  <option value="10月21日（水）13:00">10月21日（水）13:00</option>\n                  <option value="どの日でもよい・相談したい">どの日でもよい・相談したい</option>'
          }
          for old, new in replacements.items():
            if old not in s:
              raise SystemExit(f'Missing expected text: {old}')
            s = s.replace(old, new)
          if '8月5日' in s or '8月19日' in s or '8/5（水）' in s or '8/19（水）' in s:
            raise SystemExit('Old August schedule still remains')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/update-autumn-dates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-autumn-dates.yml
          git commit -m "Update青春ポップス dates for September and October [skip ci]"
          git push
